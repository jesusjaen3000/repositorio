name: Django CI

on:
  push:
    [cite_start]branches: [ "main", "master" ] # Se ejecuta al subir cambios [cite: 33]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - [cite_start]uses: actions/checkout@v4 # Descarga tu código [cite: 31]

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Instala dependencias [cite: 34]

    - name: Run Tests
      run: |
        python manage.py test # Ejecuta los tests del backend [cite: 35]